services:
  backend:
    image: futurebin-backend
    build:
      context: ./Backend
    container_name: futurebin-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: futurebin-frontend
    build:
      context: ./Frontend/FB
    container_name: futurebin-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
       condition: service_healthy
    restart: unless-stopped