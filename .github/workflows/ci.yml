name: FutureBin CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/FB/package-lock.json


      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm ci

      - name: Validate Backend Syntax
        working-directory: Backend
        run: |
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -exec node --check {} \;


      - name: Install Frontend Dependencies
        working-directory: Frontend/FB
        run: npm ci

      - name: Lint Frontend
        working-directory: Frontend/FB
        run: npm run lint

      - name: Build Frontend
        working-directory: Frontend/FB
        run: npm run build

 

      - name: Build Docker Images
        run: docker compose build

  

      - name: CI Completed
        run: echo "✅ FutureBin CI completed successfully!"